<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<title>Snake Man — demo no navegador</title>
<style>
    :root {
        --night: #0B1220;
        --board-bg: #0F1B2A;
        --board-grid: #17283D;
        --card: #132133;
        --snake: #4CD964;
        --gold: #FFC93C;
        --apple: #FF5A5F;
        --text: #E7F0FF;
        --muted: #8AA0BC;
        --outline: #2B4260;
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        height: 100%;
        background: var(--night);
        color: var(--text);
        overflow: hidden;
    }

    body {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        display: flex;
        justify-content: center;
        -webkit-tap-highlight-color: transparent;
    }

    .app {
        width: min(100vw, 620px);
        height: 100dvh;
        display: flex;
        flex-direction: column;
        padding: 10px 18px;
        gap: 8px;
    }

    header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
    }

    .brand {
        color: var(--snake);
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 3px;
        white-space: nowrap;
    }

    .stats { display: flex; gap: 18px; }
    .stat { display: flex; flex-direction: column; align-items: flex-end; }
    .stat .label { color: var(--muted); font-size: 9px; letter-spacing: 1.5px; }
    .stat .value { font-size: 20px; font-weight: 700; }

    .stage-wrap {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4px 0;
    }

    .stage {
        position: relative;
        width: min(100%, 58dvh);
        aspect-ratio: 1;
        border: 1px solid var(--outline);
        border-radius: 20px;
        overflow: hidden;
        background: var(--board-bg);
        touch-action: none;
        user-select: none;
    }

    #board { display: block; width: 100%; height: 100%; }

    .overlay { position: absolute; inset: 0; }
    .hidden { display: none !important; }

    .scrim {
        position: absolute;
        inset: 0;
        background: rgba(11, 18, 32, 0.88);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 18px;
        text-align: center;
    }

    .title { font-size: 26px; font-weight: 700; letter-spacing: 4px; }
    .title.snake { color: var(--snake); }
    .title.danger { color: var(--apple); }
    .subtitle { color: var(--muted); font-size: 10px; letter-spacing: 1px; }
    .muted { color: var(--muted); }
    .small { font-size: 10px; }
    .tiny { font-size: 9px; letter-spacing: 1px; }
    .gold { color: var(--gold); }
    .record-badge { color: var(--snake); font-size: 12px; font-weight: 700; letter-spacing: 2px; }
    .score-line { font-size: 16px; }
    .record-line { color: var(--muted); font-size: 11px; }

    .arcade {
        min-height: 44px;
        min-width: 150px;
        padding: 9px 12px;
        border-radius: 13px;
        border: 1px solid var(--outline);
        background: var(--card);
        color: var(--text);
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1px;
        cursor: pointer;
    }

    .arcade:hover { filter: brightness(1.12); }
    .arcade:active { transform: translateY(1px); }
    .arcade.filled { background: var(--snake); border-color: var(--snake); color: var(--night); }
    .arcade.wide { min-width: 170px; }
    .arcade.narrow { min-width: 112px; }

    .link-button {
        border: 0;
        background: transparent;
        color: var(--gold);
        font: inherit;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1px;
        padding: 6px 10px;
        cursor: pointer;
    }

    .mode-selector {
        display: flex;
        gap: 4px;
        padding: 4px;
        border: 1px solid var(--outline);
        border-radius: 12px;
        background: var(--board-bg);
    }

    .chip {
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1px;
        padding: 7px 12px;
        cursor: pointer;
    }

    .chip.selected { background: var(--snake); color: var(--night); }

    .music-toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 11px;
        border: 1px solid var(--outline);
        border-radius: 12px;
        background: var(--board-bg);
        color: var(--muted);
        font: inherit;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1px;
        cursor: pointer;
    }

    .music-toggle .note { font-size: 14px; }
    .music-toggle.on { color: var(--snake); }

    .chrome { display: flex; justify-content: center; padding-bottom: 8px; }

    .controls {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
    }

    .dpad {
        display: grid;
        grid-template-columns: repeat(3, 52px);
        grid-template-rows: repeat(3, 52px);
        gap: 3px;
    }

    .dpad button {
        border: 1px solid var(--outline);
        border-radius: 14px;
        background: var(--card);
        color: var(--snake);
        font: inherit;
        font-size: 20px;
        font-weight: 700;
        cursor: pointer;
    }

    .dpad button:active { background: var(--board-grid); }
    .dpad .up { grid-area: 1 / 2; }
    .dpad .left { grid-area: 2 / 1; }
    .dpad .right { grid-area: 2 / 3; }
    .dpad .down { grid-area: 3 / 2; }

    .actions { display: flex; flex-direction: column; gap: 8px; }

    .hint {
        color: var(--gold);
        font-size: 10px;
        letter-spacing: 0.5px;
        text-align: center;
    }

    .scores-screen {
        position: fixed;
        inset: 0;
        z-index: 10;
        background: var(--night);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 32px 20px 14px;
        gap: 6px;
    }

    .scores-screen h1 {
        margin: 0;
        color: var(--snake);
        font-size: 23px;
        letter-spacing: 4px;
    }

    .score-list {
        width: min(100%, 520px);
        margin-top: 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .score-row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 14px;
        border: 1px solid var(--outline);
        border-radius: 14px;
        background: rgba(19, 33, 51, 0.6);
    }

    .score-row.top { border-color: rgba(255, 201, 60, 0.55); background: var(--card); }
    .score-row .rank { width: 22px; color: var(--muted); font-size: 13px; font-weight: 700; }
    .score-row.top .rank { color: var(--gold); }
    .score-row .points { font-size: 20px; font-weight: 700; }
    .score-row .meta { margin-left: auto; text-align: right; display: flex; flex-direction: column; gap: 2px; }
    .score-row .mode { color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: 1px; }
    .score-row .mode.wrap { color: var(--snake); }
    .score-row .date { color: var(--muted); font-size: 9px; }

    .empty { color: var(--muted); font-size: 12px; letter-spacing: 1px; margin-top: 30px; }
    .empty .small { margin-top: 6px; opacity: 0.7; }

    .spacer { flex: 1; }

    @media (max-height: 700px) {
        .stage { width: min(100%, 50dvh); }
        .dpad { grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); }
        .arcade { min-height: 38px; padding: 6px 10px; }
    }
</style>
</head>
<body>
<div class="app">
    <header>
        <div class="brand">SNAKE MAN</div>
        <div class="stats">
            <div class="stat">
                <span class="label">PONTOS</span>
                <span class="value" id="score">000</span>
            </div>
            <div class="stat">
                <span class="label">RECORDE</span>
                <span class="value" id="best">000</span>
            </div>
        </div>
    </header>

    <div class="stage-wrap">
        <div class="stage" id="stage">
            <canvas id="board"></canvas>
            <div class="overlay" id="overlay"></div>
        </div>
    </div>

    <div class="chrome">
        <div class="controls hidden" id="controls">
            <div class="dpad">
                <button class="up" id="padUp" aria-label="Cima">▲</button>
                <button class="left" id="padLeft" aria-label="Esquerda">◀</button>
                <button class="right" id="padRight" aria-label="Direita">▶</button>
                <button class="down" id="padDown" aria-label="Baixo">▼</button>
            </div>
            <div class="actions">
                <button class="arcade narrow" id="pauseBtn">PAUSAR</button>
                <button class="arcade narrow" id="restartBtn">NOVO JOGO</button>
                <button class="arcade narrow" id="menuBtn">MENU</button>
            </div>
        </div>
        <div class="hint" id="hint"></div>
    </div>
</div>

<div class="scores-screen hidden" id="scoresScreen">
    <h1>RECORDES</h1>
    <div class="tiny muted">TOP 5 PARTIDAS</div>
    <div class="score-list" id="scoreList"></div>
    <div class="spacer"></div>
    <button class="arcade wide filled" id="backFromScores">VOLTAR</button>
</div>

<script src="snake-man.js"></script>
</body>
</html>
