name: Release

# Gera e publica uma release assinada sempre que uma tag v* é empurrada.
#
# Pré-requisitos (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64          keystore/snakeman-release.jks em base64
#   KEYSTORE_STORE_PASSWORD  senha do keystore
#   KEYSTORE_KEY_ALIAS       alias da chave (ex.: snakeman)
#   KEYSTORE_KEY_PASSWORD    senha da chave
#
# A tag precisa bater com o versionName de app/build.gradle.kts (v1.3 ↔ "1.3").

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build e publicação
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Conferir tag x versionName
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          EXPECTED="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ "$VERSION" != "$EXPECTED" ]; then
            echo "::error::A tag $TAG não bate com versionName \"$EXPECTED\" em app/build.gradle.kts."
            echo "Suba versionCode e versionName antes de criar a tag."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK_NAME=SnakeMan-$VERSION-release.apk" >> "$GITHUB_ENV"

      - name: Reconstruir a keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret:-}" ]; then
              echo "::error::Secret $secret ausente. Veja o cabeçalho deste workflow."
              exit 1
            fi
          done
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/snakeman-release.jks
          {
            echo "storeFile=keystore/snakeman-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore/keystore.properties

      - name: Testes, lint e APK de release
        # Escopo no :app para a release não depender dos outros módulos do repo.
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Conferir assinatura
        run: |
          set -euo pipefail
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          CERTS="$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk)"
          echo "$CERTS"
          if grep -q "CN=Android Debug" <<< "$CERTS"; then
            echo "::error::O APK saiu assinado com a chave de debug; a keystore não foi aplicada."
            exit 1
          fi

      - name: Preparar APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$APK_NAME"
          sha256sum "dist/$APK_NAME"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME já existe; reenviando o APK."
            gh release upload "$GITHUB_REF_NAME" "dist/$APK_NAME" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "dist/$APK_NAME" \
              --title "Snake Man $VERSION" \
              --generate-notes \
              --verify-tag
          fi
